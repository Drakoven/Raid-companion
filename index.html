<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Companion app for Escape from Tarkov — quests, hideout, traders, maps and ammo.">
  <meta name="theme-color" content="#d6b56d">

  <title>Raid Companion</title>

  <!-- Preconnect to API to reduce first call latency -->
  <link rel="preconnect" href="https://api.tarkov.dev">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>

  <header>
    <h1>Raid Companion</h1>
    <p>Companion app for Escape from Tarkov</p>
  </header>

  <main>
    <input
      type="search"
      id="searchInput"
      placeholder="Search quests, items..."
      aria-label="Search"
    />

    <section id="content" aria-live="polite"></section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button onclick="showHome()">🏠</button>
    <button onclick="getQuests()">📋</button>
    <button onclick="showItems()">🎒</button>
    <button onclick="showMaps()">🗺</button>
    <button onclick="showHideout()">🏚</button>
    <button onclick="showTraders()">💰</button>
    <button onclick="showAmmo()">🔫</button>
    <button onclick="showStoryline()">📖</button>
    <button onclick="showFavorites()">⭐</button>
  </nav>

  <script src="app.js"></script>

</body>
</html>
