<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Companion app for Escape from Tarkov — quests, hideout, traders, maps and ammo.">
  <meta name="theme-color" content="#d6b56d">

  <title>Raid Companion</title>

  <!-- Preconnect to API to reduce first call latency -->
  <link rel="preconnect" href="https://api.tarkov.dev">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
</head>
<body>

  <header>
    <h1>Raid Companion</h1>
    <p>Companion app for Escape from Tarkov</p>
  </header>

  <main>
    <input
      type="search"
      id="searchInput"
      placeholder="Search quests, items..."
      aria-label="Search"
    />

    <section id="content" aria-live="polite"></section>
  </main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button onclick="showHome()">🏠</button>
    <button onclick="getQuests()">📋</button>
    <button onclick="showItems()">🎒</button>
    <button onclick="showMaps()">🗺</button>
    <button onclick="showHideout()">🏚</button>
    <button onclick="showTraders()">💰</button>
    <button onclick="showAmmo()">🔫</button>
    <button onclick="showStoryline()">📖</button>
    <button onclick="showFavorites()">⭐</button>
  </nav>

  <!-- Core -->
  <script src="js/state.js"></script>
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>

  <!-- Map markers -->
  <script src="js/markers/woods.js"></script>
  <script src="js/markers/customs.js"></script>
  <script src="js/markers/factory.js"></script>
  <script src="js/markers/shoreline.js"></script>
  <script src="js/markers/groundzero.js"></script>

  <!-- Features -->
  <script src="js/maps.js"></script>
  <script src="js/quests.js"></script>
  <script src="js/items.js"></script>
  <script src="js/hideout.js"></script>
  <script src="js/traders.js"></script>
  <script src="js/ammo.js"></script>
  <script src="js/favorites.js"></script>
  <script src="js/storyline.js"></script>
  <script src="js/home.js"></script>
  <script src="js/search.js"></script>

  <!-- Service Worker -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker
        .register("service-worker.js")
        .then(() => console.log("Service Worker registered"))
        .catch(error => console.error("SW error :", error));
    }
  </script>

</body>
</html>
